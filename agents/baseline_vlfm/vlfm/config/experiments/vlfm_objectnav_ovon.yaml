# @package _global_

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - stretch_ovon
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
      - clip_objectgoal_sensor
  - /habitat/task/measurements:
      - top_down_map
      - traveled_stairs
  - /habitat_baselines/rl/policy: vlfm_policy
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        turn_angle: 30
      clip_objectgoal_sensor:
        cache: ../data/hm3d_ovon/text_embeddings/siglip.pkl
    measurements:
      top_down_map:
        draw_goal_aabbs: False
      success:
        success_distance: 0.25
      distance_to_goal:
        type: OVONDistanceToGoal
  dataset:
    type: "OVON-v1"
    split: val_unseen
    data_path: ../data/datasets/ovon/hm3d/{split}/{split}_hard.json.gz
    scenes_dir: ../data/scene_datasets
  simulator:
    type: "OVONSim-v0"
    turn_angle: 30
    navmesh_settings:
      agent_max_climb: 0.1
      cell_height: 0.05

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False

  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  checkpoint_folder: "data/new_checkpoints"
  trainer_name: "vlfm"
  num_updates: 270000
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: True

  eval:
    split: "val_unseen"
    # video_option: ["disk"]

  rl:
    policy:
      name: "HabitatITMPolicyV2"

    ppo:
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 64
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50
      use_normalized_advantage: False
      hidden_size: 512

    ddppo:
      sync_frac: 0.6
      distrib_backend: NCCL
      pretrained_weights: data/ddppo-models/gibson-2plus-resnet50.pth
      pretrained: False
      pretrained_encoder: False
      train_encoder: True
      reset_critic: False
      backbone: resnet50
      rnn_type: LSTM
      num_recurrent_layers: 2
