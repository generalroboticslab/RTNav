# @package _global_
#
# Minimal HM3D ObjectNav config for the rt_ovn env container.
# Avoids VLFM-only hydra groups (e.g. vlfm_policy, frontier sensors).

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/task/lab_sensors:
      - compass_sensor
      - gps_sensor
  - /habitat/task/measurements:
      - top_down_map
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    measurements:
      top_down_map:
        draw_goal_aabbs: False
  dataset:
    split: val_mini
    data_path: /opt/rt_ovn/data/datasets/objectnav/hm3d/v1/val_mini/val_mini.json.gz
    scenes_dir: /opt/rt_ovn/data/scene_datasets

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False
  torch_gpu_id: 0
  trainer_name: vlfm
  num_updates: 270000
  log_interval: 10
  num_checkpoints: 100
  force_torch_single_threaded: True
  eval:
    split: val_mini
  rl:
    policy:
      name: PointNavResNetPolicy
    ppo:
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.2
      num_steps: 64
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: False
      use_linear_lr_decay: False
      reward_window_size: 50
      use_normalized_advantage: False
      hidden_size: 512
