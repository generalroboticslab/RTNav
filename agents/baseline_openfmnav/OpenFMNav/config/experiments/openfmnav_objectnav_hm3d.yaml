# @package _global_

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/task/lab_sensors:
      - compass_sensor
      - gps_sensor
      - heading_sensor
  - /habitat/task/measurements:
      - top_down_map
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    measurements:
      top_down_map:
        draw_goal_aabbs: False
  simulator:
    action_space_config: "v1"
    turn_angle: 30
    tilt_angle: 30
  dataset:
    split: val
    data_path: data/datasets/objectnav/hm3d/v1/val/val.json.gz
    scenes_dir: data/scene_datasets

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  checkpoint_folder: "data/new_checkpoints"
  trainer_name: "openfmnav"
  force_torch_single_threaded: True
  eval:
    split: "val"
