# @package _global_

defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/objectnav: hm3d
  - /habitat/task/lab_sensors:
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - clip_objectgoal_sensor
  - /habitat/task/measurements:
      - top_down_map
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      clip_objectgoal_sensor:
        cache: data/hm3d_ovon/text_embeddings/siglip.pkl
    measurements:
      top_down_map:
        draw_goal_aabbs: False
      success:
        success_distance: 0.25
      distance_to_goal:
        type: OVONDistanceToGoal
  dataset:
    type: "OVON-v1"
    split: val_unseen
    data_path: data/datasets/ovon/hm3d/{split}/{split}_hard.json.gz
    scenes_dir: data/scene_datasets
  simulator:
    type: "OVONSim-v0"
    action_space_config: "v1"
    turn_angle: 30
    tilt_angle: 30
    navmesh_settings:
      agent_max_climb: 0.1
      cell_height: 0.05

habitat_baselines:
  evaluate: True
  eval_ckpt_path_dir: data/dummy_policy.pth
  num_environments: 1
  load_resume_state_config: False
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir"
  test_episode_count: -1
  checkpoint_folder: "data/new_checkpoints"
  trainer_name: "l3mvn"
  force_torch_single_threaded: True
  eval:
    split: "val_unseen"
