# @package _global_

# Shared HM3D ObjectNav environment config for all baselines.
defaults:
  - /habitat_baselines: habitat_baselines_rl_config_base
  - /benchmark/nav/objectnav: objectnav_hm3d
  - /habitat/simulator/sim_sensors@habitat.simulator.agents.main_agent.sim_sensors.semantic_sensor: semantic_sensor
  - /habitat/task/lab_sensors:
      - base_explorer
      - compass_sensor
      - gps_sensor
      - heading_sensor
      - frontier_sensor
  - /habitat/task/measurements:
      - failure_modes
      - top_down_map
  - _self_

habitat:
  environment:
    iterator_options:
      max_scene_repeat_steps: 50000
  task:
    success_reward: 2.5
    slack_reward: -1e-3
    lab_sensors:
      base_explorer:
        turn_angle: 30
    measurements:
      top_down_map:
        draw_goal_aabbs: false
  dataset:
    split: val
    data_path: /opt/rt_ovn/data/datasets/objectnav/hm3d/v1/{split}/{split}.json.gz
    scenes_dir: /opt/rt_ovn/data/versioned_data/hm3d-0.2
  simulator:
    action_space_config: "v1"
    scene_dataset: /opt/rt_ovn/data/versioned_data/hm3d-0.2/hm3d/hm3d_annotated_basis.scene_dataset_config.json

habitat_baselines:
  num_environments: 1
  force_torch_single_threaded: true
  eval:
    split: val

hydra:
  run:
    dir: ${oc.env:HYDRA_RUN_DIR,/tmp/rt_ovn_hydra}/${now:%Y-%m-%d}/${now:%H-%M-%S}
